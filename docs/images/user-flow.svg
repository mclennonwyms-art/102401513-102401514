<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#253b2b}.h{font-size:28px;font-weight:700}.s{font-size:18px}.n{fill:#fffdf8;stroke:#cad6c6;stroke-width:2}.p{fill:#3f6239}.a{fill:#dce9d7}.w{fill:#fff}.line{stroke:#6f826b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6f826b"/></marker></defs>
  <rect width="1200" height="520" rx="26" fill="#eef3eb"/>
  <text x="60" y="58" class="t h">校园失物招领小程序 · 核心使用流程</text>
  <rect x="60" y="100" width="180" height="78" rx="18" class="p"/><text x="150" y="147" text-anchor="middle" class="t s w">进入首页</text>
  <path d="M240 139H300" class="line" marker-end="url(#arrow)"/>
  <rect x="310" y="100" width="210" height="78" rx="18" class="n"/><text x="415" y="132" text-anchor="middle" class="t s">浏览最新信息</text><text x="415" y="158" text-anchor="middle" class="t s">或输入关键词</text>
  <path d="M520 139H580" class="line" marker-end="url(#arrow)"/>
  <rect x="590" y="100" width="210" height="78" rx="18" class="n"/><text x="695" y="132" text-anchor="middle" class="t s">查看列表结果</text><text x="695" y="158" text-anchor="middle" class="t s">筛选寻物 / 招领</text>
  <path d="M800 139H860" class="line" marker-end="url(#arrow)"/>
  <rect x="870" y="100" width="270" height="78" rx="18" class="a"/><text x="1005" y="132" text-anchor="middle" class="t s">查看物品详情</text><text x="1005" y="158" text-anchor="middle" class="t s">核对特征并联系发布者</text>
  <rect x="60" y="280" width="180" height="78" rx="18" class="p"/><text x="150" y="327" text-anchor="middle" class="t s w">进入发布页</text>
  <path d="M240 319H300" class="line" marker-end="url(#arrow)"/>
  <rect x="310" y="280" width="210" height="78" rx="18" class="n"/><text x="415" y="312" text-anchor="middle" class="t s">选择信息类型</text><text x="415" y="338" text-anchor="middle" class="t s">寻物 / 招领</text>
  <path d="M520 319H580" class="line" marker-end="url(#arrow)"/>
  <rect x="590" y="280" width="210" height="78" rx="18" class="n"/><text x="695" y="312" text-anchor="middle" class="t s">填写名称、地点</text><text x="695" y="338" text-anchor="middle" class="t s">特征与联系方式</text>
  <path d="M800 319H860" class="line" marker-end="url(#arrow)"/>
  <rect x="870" y="280" width="270" height="78" rx="18" class="a"/><text x="1005" y="312" text-anchor="middle" class="t s">确认发布成功</text><text x="1005" y="338" text-anchor="middle" class="t s">在“我的发布”修改状态</text>
  <path d="M1005 358V430H415V358" class="line dash" marker-end="url(#arrow)"/>
  <text x="710" y="462" text-anchor="middle" class="t s">物品找回后及时标记“已完成”，减少无效信息</text>
</svg>
